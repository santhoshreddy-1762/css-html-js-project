<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties</title>

    <style>

        /* Element Selector */
        h1 {
            color: blue;
            font-family: Arial;
            text-align: center;
        }

        /* Class Selector */
        .box {
            background-color: lightgray;
            color: black;

            font-size: 18px;

            margin: 30px;
            padding: 20px;

            border: 3px solid black;
        }

        /* ID Selector */
        #special {
            color: red;
            font-weight: bold;
        }

    </style>

</head>
<body>

    <h1>CSS Example</h1>

    <div class="box">
        This is a box with margin, padding, and a border.
    </div>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

</body>
</html>
