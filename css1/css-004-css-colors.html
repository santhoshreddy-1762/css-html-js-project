<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>
    <style>
        body {
            background-color: #f1f5f9;
        }

        h1 {
            color: blue;
        }

        .box {
            background-color: lightyellow;
            border: 3px solid green;
            color: darkred;
            padding: 30px;
            width: 400px;
            margin: 50px auto;
            text-align: center;
        }

        button {
            background-color: purple;
            color: white;
            border: 2px solid black;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>CSS Colors</h1>
    <p>This text uses CSS color properties.</p>
    <button>Click Me</button>
</div>

</body>
</html>
