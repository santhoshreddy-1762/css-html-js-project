<!DOCTYPE html>
<html>
<head>
    <title>CSS Background</title>
    <style>
        body {
            background-color: #e0f2fe;
        }

        .background {
            width: 80%;
            height: 400px;
            margin: 50px auto;

            background-image: url("https://images.unsplash.com/photo-1500534623283-312aade485b7");
            background-color: lightblue;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            text-align: center;
            padding-top: 150px;
        }

        h1 {
            font-size: 40px;
        }
    </style>
</head>
<body>

<div class="background">
    <h1>CSS Background Properties</h1>
    <p>Image, color, position, size, repeat and attachment</p>
</div>

</body>
</html>
