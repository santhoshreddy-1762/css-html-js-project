<!DOCTYPE html>
<html>
<head>
    <title>Clear localStorage</title>
</head>
<body>
    <h2>Clear All Storage Data</h2>
    <button onclick="clearData()">Clear All Data</button>
    <p id="output"></p>

    <script>
        function clearData() {
            localStorage.clear();
            document.getElementById("output").innerText =
                "All localStorage data cleared";
        }
    </script>
</body>
</html>
