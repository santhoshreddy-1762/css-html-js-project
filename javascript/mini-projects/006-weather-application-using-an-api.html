
<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <style>
        body { font-family: Arial; text-align: center; background: #e3f2fd; padding: 40px; }
        .card { background: white; padding: 25px; max-width: 400px; margin: auto; border-radius: 12px; }
        input, button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Weather App</h1>
        <input id="city" placeholder="Enter city">
        <button onclick="getWeather()">Search</button>
        <div id="result">Enter a city to check the weather.</div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value.trim();
            const result = document.getElementById("result");

            if (!city) {
                result.textContent = "Please enter a city.";
                return;
            }

            result.textContent = "Loading...";

            try {
                const geoResponse = await fetch(
                    "https://geocoding-api.open-meteo.com/v1/search?name=" +
                    encodeURIComponent(city) + "&count=1"
                );

                if (!geoResponse.ok) throw new Error("Geocoding failed");
                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    result.textContent = "City not found.";
                    return;
                }

                const place = geoData.results[0];
                const weatherResponse = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude=" +
                    place.latitude + "&longitude=" + place.longitude +
                    "&current=temperature_2m,relative_humidity_2m,wind_speed_10m"
                );

                if (!weatherResponse.ok) throw new Error("Weather request failed");
                const weatherData = await weatherResponse.json();
                const current = weatherData.current;

                result.innerHTML = "";
                const heading = document.createElement("h2");
                heading.textContent = place.name +
                    (place.country ? ", " + place.country : "");
                result.appendChild(heading);

                [
                    "Temperature: " + current.temperature_2m + " °C",
                    "Humidity: " + current.relative_humidity_2m + "%",
                    "Wind speed: " + current.wind_speed_10m + " km/h"
                ].forEach(text => {
                    const p = document.createElement("p");
                    p.textContent = text;
                    result.appendChild(p);
                });
            } catch {
                result.textContent = "Unable to load weather. Check your internet connection.";
            }
        }
    </script>
</body>
</html>
