
<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
</head>
<body style="font-family:Arial;max-width:550px;margin:40px auto">
    <h1>Expense Tracker</h1>
    <input id="title" placeholder="Expense name">
    <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount">
    <button onclick="addExpense()">Add Expense</button>
    <h2 id="total">Total: ₹0.00</h2>
    <ul id="list"></ul>

    <script>
        let expenses = [];

        function addExpense() {
            const title = document.getElementById("title").value.trim();
            const amount = Number(document.getElementById("amount").value);

            if (!title || !Number.isFinite(amount) || amount <= 0) {
                alert("Enter a name and a positive amount.");
                return;
            }

            expenses.push({ title, amount });
            document.getElementById("title").value = "";
            document.getElementById("amount").value = "";
            render();
        }

        function render() {
            const list = document.getElementById("list");
            list.innerHTML = "";
            let total = 0;

            expenses.forEach((expense, index) => {
                total += expense.amount;
                const li = document.createElement("li");
                li.textContent = expense.title + " - ₹" + expense.amount.toFixed(2) + " ";

                const button = document.createElement("button");
                button.textContent = "Delete";
                button.onclick = () => {
                    expenses.splice(index, 1);
                    render();
                };

                li.appendChild(button);
                list.appendChild(li);
            });

            document.getElementById("total").textContent =
                "Total: ₹" + total.toFixed(2);
        }
    </script>
</body>
</html>
