
<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
    <style>
        body { text-align: center; font-family: Arial; margin-top: 100px; }
        #time { font-size: 45px; margin: 25px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Stopwatch</h1>
    <div id="time">00:00:00.0</div>
    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

    <script>
        let startTime = 0;
        let elapsed = 0;
        let timer = null;

        function showTime() {
            const total = elapsed + (Date.now() - startTime);
            const tenths = Math.floor(total / 100) % 10;
            const seconds = Math.floor(total / 1000) % 60;
            const minutes = Math.floor(total / 60000) % 60;
            const hours = Math.floor(total / 3600000);

            document.getElementById("time").textContent =
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0") + "." + tenths;
        }

        function start() {
            if (timer !== null) return;
            startTime = Date.now();
            timer = setInterval(showTime, 50);
        }

        function stop() {
            if (timer === null) return;
            elapsed += Date.now() - startTime;
            clearInterval(timer);
            timer = null;
            showTime();
        }

        function reset() {
            stop();
            elapsed = 0;
            showTime();
        }
    </script>
</body>
</html>
