
<!DOCTYPE html>
<html>
<head>
    <title>Tic-Tac-Toe</title>
    <style>
        body { font-family: Arial; text-align: center; }
        #board { display: grid; grid-template-columns: repeat(3, 90px); gap: 5px; justify-content: center; }
        #board button { height: 90px; font-size: 35px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <div id="board"></div>
    <h3 id="status">Player X's turn</h3>
    <button onclick="resetGame()">Restart Game</button>

    <script>
        let cells = Array(9).fill("");
        let player = "X";
        let gameOver = false;
        const board = document.getElementById("board");
        const wins = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        function render() {
            board.innerHTML = "";
            cells.forEach((value, i) => {
                const button = document.createElement("button");
                button.textContent = value;
                button.onclick = () => play(i);
                button.disabled = Boolean(value) || gameOver;
                board.appendChild(button);
            });
        }

        function play(i) {
            if (cells[i] || gameOver) return;
            cells[i] = player;

            const won = wins.some(line =>
                line.every(index => cells[index] === player)
            );

            if (won) {
                document.getElementById("status").textContent =
                    "Player " + player + " wins!";
                gameOver = true;
            } else if (cells.every(Boolean)) {
                document.getElementById("status").textContent = "It's a draw!";
                gameOver = true;
            } else {
                player = player === "X" ? "O" : "X";
                document.getElementById("status").textContent =
                    "Player " + player + "'s turn";
            }

            render();
        }

        function resetGame() {
            cells = Array(9).fill("");
            player = "X";
            gameOver = false;
            document.getElementById("status").textContent = "Player X's turn";
            render();
        }

        render();
    </script>
</body>
</html>
