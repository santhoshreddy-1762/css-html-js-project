
<!DOCTYPE html>
<html>
<head>
    <title>Digital Calculator</title>
    <style>
        body { font-family: Arial; text-align: center; background: #eaf2f8; }
        .calculator { width: 280px; margin: 50px auto; padding: 20px; background: #222; border-radius: 12px; }
        input { width: 95%; height: 45px; font-size: 24px; margin-bottom: 10px; text-align: right; }
        button { width: 55px; height: 48px; margin: 3px; font-size: 18px; cursor: pointer; }
        .equal { background: #00a6a6; color: white; }
    </style>
</head>
<body>
    <h2>Digital Calculator</h2>
    <div class="calculator">
        <input id="display" readonly>
        <br>
        <button onclick="clearDisplay()">C</button>
        <button onclick="add('/')">/</button>
        <button onclick="add('*')">*</button>
        <button onclick="removeLast()">⌫</button><br>
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('-')">-</button><br>
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('+')">+</button><br>
        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calculate()" class="equal">=</button><br>
        <button onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
    </div>
    <script>
        const display = document.getElementById("display");

        function add(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function removeLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            if (!display.value || !/^[0-9+\-*/.() ]+$/.test(display.value)) {
                display.value = "Invalid";
                return;
            }

            try {
                const result = Function('"use strict"; return (' + display.value + ')')();
                display.value = Number.isFinite(result) ? result : "Error";
            } catch {
                display.value = "Error";
            }
        }
    </script>
</body>
</html>
