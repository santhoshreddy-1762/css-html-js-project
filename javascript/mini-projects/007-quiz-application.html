
<!DOCTYPE html>
<html>
<head>
    <title>Quiz Application</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { display: block; margin: 10px 0; padding: 12px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h1>JavaScript Quiz</h1>
    <h3 id="question"></h3>
    <div id="options"></div>
    <p id="result"></p>
    <button id="next" onclick="nextQuestion()" hidden>Next Question</button>

    <script>
        const questions = [
            { q: "Which language runs in a browser?", a: ["Python", "JavaScript", "C"], correct: 1 },
            { q: "Which keyword declares a constant?", a: ["let", "var", "const"], correct: 2 },
            { q: "Which method selects an element by ID?", a: ["getElementById()", "queryArray()", "getClass()"], correct: 0 }
        ];

        let index = 0;
        let score = 0;
        let answered = false;

        function showQuestion() {
            answered = false;
            document.getElementById("result").textContent = "";
            document.getElementById("next").hidden = true;
            document.getElementById("question").textContent =
                (index + 1) + ". " + questions[index].q;

            const options = document.getElementById("options");
            options.innerHTML = "";

            questions[index].a.forEach((answer, i) => {
                const button = document.createElement("button");
                button.textContent = answer;
                button.onclick = () => checkAnswer(i);
                options.appendChild(button);
            });
        }

        function checkAnswer(choice) {
            if (answered) return;
            answered = true;

            if (choice === questions[index].correct) {
                score++;
                document.getElementById("result").textContent = "Correct!";
            } else {
                document.getElementById("result").textContent =
                    "Incorrect. Answer: " + questions[index].a[questions[index].correct];
            }

            document.getElementById("next").hidden = false;
            document.getElementById("next").textContent =
                index === questions.length - 1 ? "Show Score" : "Next Question";
        }

        function nextQuestion() {
            if (index < questions.length - 1) {
                index++;
                showQuestion();
            } else {
                document.body.innerHTML =
                    "<h1>Quiz Completed!</h1><h2>Your Score: " +
                    score + " / " + questions.length + "</h2><button onclick='location.reload()'>Try Again</button>";
            }
        }

        showQuestion();
    </script>
</body>
</html>
