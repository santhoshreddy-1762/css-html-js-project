
<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
    <style>
        body { background: #101820; color: #00ffcc; text-align: center; font-family: Arial; padding-top: 100px; }
        #clock { font-size: 55px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Digital Clock</h1>
    <div id="clock"></div>
    <p id="date"></p>
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById("clock").textContent =
                now.toLocaleTimeString();
            document.getElementById("date").textContent =
                now.toLocaleDateString(undefined, {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
