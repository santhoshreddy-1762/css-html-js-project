
<!DOCTYPE html>
<html>
<head>
    <title>Password Generator</title>
</head>
<body style="font-family:Arial;text-align:center;margin-top:70px">
    <h1>Random Password Generator</h1>
    <label>Password length:
        <input type="number" id="length" value="12" min="8" max="64">
    </label>
    <br><br>
    <button onclick="generatePassword()">Generate Password</button>
    <p><input id="password" readonly style="width:280px;padding:10px"></p>
    <button onclick="copyPassword()">Copy Password</button>
    <p id="message"></p>

    <script>
        function generatePassword() {
            const length = Number(document.getElementById("length").value);

            if (!Number.isInteger(length) || length < 8 || length > 64) {
                alert("Choose a length from 8 to 64.");
                return;
            }

            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*";
            const random = new Uint32Array(length);
            crypto.getRandomValues(random);

            let password = "";
            for (let i = 0; i < length; i++) {
                password += chars[random[i] % chars.length];
            }

            document.getElementById("password").value = password;
            document.getElementById("message").textContent = "";
        }

        async function copyPassword() {
            const password = document.getElementById("password").value;
            if (!password) return;

            try {
                await navigator.clipboard.writeText(password);
                document.getElementById("message").textContent = "Password copied!";
            } catch {
                document.getElementById("password").select();
                document.getElementById("message").textContent =
                    "Select and copy the password manually.";
            }
        }
    </script>
</body>
</html>
