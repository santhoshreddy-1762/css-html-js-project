<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 40px; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>

<h2>15. JavaScript Functions</h2>

<button onclick="showResult()">Run Function</button>

<p id="result"></p>

<script>
function add(a, b) {
    return a + b;
}

function showResult() {
    let result = add(10, 20);

    document.getElementById("result").innerHTML =
        "10 + 20 = " + result;
}
</script>

</body>
</html>
