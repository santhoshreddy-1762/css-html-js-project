<!DOCTYPE html>
<html>
<head>
    <title>Hello World</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>

<h2>1. Hello World</h2>
<button onclick="showMessage()">Click Here</button>

<script>

}
</script>

</body>
</html>
