<!DOCTYPE html>
<html>
<head>
    <title>getElementById and getElementsByClassName</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        .item {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<h2 id="heading">DOM Methods</h2>

<p class="item">HTML</p>
<p class="item">CSS</p>
<p class="item">JavaScript</p>

<button onclick="changeElements()">Change Elements</button>

<script>
function changeElements() {
    document.getElementById("heading").innerHTML =
        "getElementById() Used";

    let elements =
        document.getElementsByClassName("item");

    for (let i = 0; i < elements.length; i++) {
        elements[i].style.color = "blue";
        elements[i].style.fontWeight = "bold";
        elements[i].style.backgroundColor = "lightblue";
    }
}
</script>

</body>
</html>
