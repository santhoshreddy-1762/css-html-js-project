<!DOCTYPE html>
<html>
<head>
    <title>Password Show Hide</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

<h2>12. Password Show / Hide</h2>

<input
    type="password"
    id="password"
    placeholder="Enter password"
>

<button onclick="togglePassword()" id="button">
    Show
</button>

<script>
function togglePassword() {
    let password =
        document.getElementById("password");

    let button =
        document.getElementById("button");

    if (password.type === "password") {
        password.type = "text";
        button.innerHTML = "Hide";
    } else {
        password.type = "password";
        button.innerHTML = "Show";
    }
}
</script>

</body>
</html>
