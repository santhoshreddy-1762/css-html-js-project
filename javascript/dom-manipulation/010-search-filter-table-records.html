<!DOCTYPE html>
<html>
<head>
    <title>Search Filter Table</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        input {
            padding: 10px;
            width: 300px;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #555;
            padding: 10px;
        }

        th {
            background-color: #1e3a8a;
            color: white;
        }
    </style>
</head>
<body>

<h2>10. Search / Filter Table Records</h2>

<input
    type="text"
    id="search"
    placeholder="Search student"
    onkeyup="searchTable()"
>

<table id="table">

    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Department</th>
    </tr>

    <tr>
        <td>Santhosh</td>
        <td>21</td>
        <td>CSE</td>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>22</td>
        <td>ECE</td>
    </tr>

    <tr>
        <td>Kiran</td>
        <td>20</td>
        <td>IT</td>
    </tr>

    <tr>
        <td>Arjun</td>
        <td>21</td>
        <td>CSE</td>
    </tr>

</table>

<script>
function searchTable() {
    let input =
        document.getElementById("search")
        .value
        .toLowerCase();

    let rows =
        document.getElementById("table")
        .getElementsByTagName("tr");

    for (let i = 1; i < rows.length; i++) {

        let name =
            rows[i]
            .getElementsByTagName("td")[0]
            .textContent
            .toLowerCase();

        if (name.includes(input)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}
</script>

</body>
</html>
