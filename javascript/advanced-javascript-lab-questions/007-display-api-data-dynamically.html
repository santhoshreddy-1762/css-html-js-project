<!DOCTYPE html>
<html>
<head>
    <title>Dynamic API Data</title>
</head>
<body>
    <h2>Users</h2>
    <button onclick="loadUsers()">Load Users</button>
    <div id="users"></div>

    <script>
        function loadUsers() {
            fetch("https://jsonplaceholder.typicode.com/users")
                .then(response => response.json())
                .then(data => {
                    let output = "";

                    data.forEach(user => {
                        output += `
                            <div>
                                <h3>${user.name}</h3>
                                <p>${user.email}</p>
                                <hr>
                            </div>
                        `;
                    });

                    document.getElementById("users").innerHTML = output;
                });
        }
    </script>
</body>
</html>
