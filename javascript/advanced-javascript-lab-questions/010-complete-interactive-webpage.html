<!DOCTYPE html>
<html>
<head>
    <title>Interactive Webpage</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        .box {
            margin: 50px auto;
            padding: 30px;
            max-width: 500px;
            background: white;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1 id="title">Welcome</h1>
        <p id="message">Click a button</p>

        <button onclick="changeText()">Change Text</button>
        <button onclick="changeColor()">Change Color</button>
    </div>

    <script>
        function changeText() {
            document.getElementById("message").innerHTML =
                "JavaScript makes webpages interactive!";
        }

        function changeColor() {
            document.body.style.background = "#cceeff";
        }
    </script>

</body>
</html>
