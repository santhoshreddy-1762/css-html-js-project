<!DOCTYPE html>
<html>
<head>
    <title>Count Words</title>
</head>
<body>
    <h2>Count Words</h2>

    <input type="text" id="text">
    <button onclick="countWords()">Count</button>

    <p id="output"></p>

    <script>
        function countWords() {
            let text = document.getElementById("text").value.trim();

            if (text === "") {
                document.getElementById("output").innerHTML = "Words: 0";
                return;
            }

            let words = text.split(/\s+/);

            document.getElementById("output").innerHTML =
                "Words: " + words.length;
        }
    </script>
</body>
</html>
