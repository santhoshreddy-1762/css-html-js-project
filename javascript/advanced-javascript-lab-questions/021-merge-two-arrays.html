<!DOCTYPE html>
<html>
<head>
    <title>Merge Arrays</title>
</head>
<body>
    <h2>Merge Two Arrays</h2>

    <button onclick="merge()">Merge</button>
    <p id="output"></p>

    <script>
        function merge() {
            let a = [1, 2, 3];
            let b = [4, 5, 6];

            let result = [...a, ...b];

            document.getElementById("output").innerHTML =
                result.join(", ");
        }
    </script>
</body>
</html>
