<!DOCTYPE html>
<html>
<head>
    <title>Count Digits</title>
</head>
<body>
    <h2>Count Number of Digits</h2>

    <input type="number" id="num">
    <button onclick="countDigits()">Count</button>

    <p id="output"></p>

    <script>
        function countDigits() {
            let num = Math.abs(Number(document.getElementById("num").value));
            let count = String(num).length;

            document.getElementById("output").innerHTML =
                "Number of digits = " + count;
        }
    </script>
</body>
</html>
