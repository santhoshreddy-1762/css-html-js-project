
<!DOCTYPE html>
<html>
<head>
    <title>Redirect Webpage</title>
</head>
<body>
    <h2>Redirect to Another Webpage</h2>
    <p>Click the button to open the OpenAI website.</p>
    <button onclick="redirect()">Visit OpenAI</button>

    <script>
        function redirect() {
            window.location.href = "https://openai.com/";
        }
    </script>
</body>
</html>
