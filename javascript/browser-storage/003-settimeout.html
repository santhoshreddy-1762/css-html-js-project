
<!DOCTYPE html>
<html>
<head>
    <title>setTimeout Example</title>
</head>
<body>
    <h2>setTimeout Example</h2>
    <button onclick="startTimer()">Start</button>
    <p id="result">Click Start to display a message after 3 seconds.</p>

    <script>
        let timer;

        function startTimer() {
            clearTimeout(timer);
            document.getElementById("result").textContent = "Please wait...";

            timer = setTimeout(function() {
                document.getElementById("result").textContent =
                    "Hello! Three seconds have passed.";
            }, 3000);
        }
    </script>
</body>
</html>
