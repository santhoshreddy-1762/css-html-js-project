
<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>
</head>
<body>
    <h2>JavaScript History Object</h2>
    <button onclick="showHistory()">Show History Information</button>
    <p id="result"></p>

    <script>
        function showHistory() {
            document.getElementById("result").textContent =
                "Number of entries in this tab's session history: " +
                window.history.length;
        }
    </script>
</body>
</html>
