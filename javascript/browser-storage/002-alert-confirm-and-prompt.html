
<!DOCTYPE html>
<html>
<head>
    <title>Alert Confirm Prompt</title>
</head>
<body>
    <h2>Alert, Confirm and Prompt</h2>
    <button onclick="showAlert()">Alert</button>
    <button onclick="showConfirm()">Confirm</button>
    <button onclick="showPrompt()">Prompt</button>
    <p id="result"></p>

    <script>
        function showAlert() {
            alert("Welcome to JavaScript!");
        }

        function showConfirm() {
            const answer = confirm("Do you want to continue?");
            document.getElementById("result").textContent =
                answer ? "You selected OK." : "You selected Cancel.";
        }

        function showPrompt() {
            const name = prompt("Enter your name:");
            document.getElementById("result").textContent =
                name === null ? "You cancelled the prompt." :
                "Hello, " + (name.trim() || "Guest") + "!";
        }
    </script>
</body>
</html>
