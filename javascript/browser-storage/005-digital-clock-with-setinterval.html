
<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
    <style>
        body {
            text-align: center;
            background: #101820;
            color: #00ffcc;
            font-family: Arial;
            padding-top: 100px;
        }
        #clock { font-size: 50px; }
    </style>
</head>
<body>
    <h2>Digital Clock</h2>
    <h1 id="clock"></h1>

    <script>
        function updateClock() {
            document.getElementById("clock").textContent =
                new Date().toLocaleTimeString();
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
