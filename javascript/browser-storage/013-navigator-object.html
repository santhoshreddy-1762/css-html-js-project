
<!DOCTYPE html>
<html>
<head>
    <title>Navigator Object</title>
</head>
<body>
    <h2>JavaScript Navigator Object</h2>
    <button onclick="showNavigator()">Show Information</button>
    <p id="result"></p>

    <script>
        function showNavigator() {
            const nav = window.navigator;

            document.getElementById("result").innerHTML =
                "Browser Language: " + nav.language + "<br>" +
                "Online Status: " + nav.onLine + "<br>" +
                "Cookies Enabled: " + nav.cookieEnabled + "<br>" +
                "Platform: " + nav.platform + "<br>" +
                "User Agent: " + nav.userAgent;
        }
    </script>
</body>
</html>
