<!DOCTYPE html>
<html>
<head>
    <title>Button Click</title>
</head>
<body>

<h2>Button Click Event</h2>

<button onclick="showMessage()">Click Me</button>

<p id="output"></p>

<script>
function showMessage() {
    document.getElementById("output").innerHTML =
        "Button was clicked!";
}
</script>

</body>
</html>
