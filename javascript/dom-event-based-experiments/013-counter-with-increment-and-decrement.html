<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        #count {
            font-size: 50px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }
    </style>
</head>
<body>

<h2>Counter Application</h2>

<div id="count">0</div>

<button onclick="decrement()">-</button>
<button onclick="reset()">Reset</button>
<button onclick="increment()">+</button>

<script>
let count = 0;

function increment() {
    count++;
    document.getElementById("count").innerHTML = count;
}

function decrement() {
    count--;
    document.getElementById("count").innerHTML = count;
}

function reset() {
    count = 0;
    document.getElementById("count").innerHTML = count;
}
</script>

</body>
</html>
