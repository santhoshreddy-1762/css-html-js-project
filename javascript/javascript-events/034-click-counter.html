
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Click Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 50px;
        }

        h1 {
            color: #007bff;
        }

        #count {
            font-size: 55px;
            margin: 25px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Click Counter</h1>
    <p>Click the button to increase the count.</p>

    <h2 id="count">0</h2>

    <button onclick="increaseCount()">Click Me</button>
    <button onclick="resetCount()">Reset</button>

    <script>
        let count = 0;

        function increaseCount() {
            count++;
            document.getElementById("count").textContent = count;
        }

        function resetCount() {
            count = 0;
            document.getElementById("count").textContent = count;
        }
    </script>
</body>
</html>
