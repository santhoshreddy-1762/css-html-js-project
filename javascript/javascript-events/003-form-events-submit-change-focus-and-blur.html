
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Events</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input, select, button {
            display: block;
            margin: 12px 0;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Form Events Demonstration</h1>

    <form id="myForm">
        <input type="text" id="name" placeholder="Enter your name" required>

        <input type="email" id="email" placeholder="Enter your email" required>

        <select id="course">
            <option value="">Select a course</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
        </select>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <p id="result">Form event messages appear here.</p>

    <script>
        const nameInput = document.getElementById("name");
        const course = document.getElementById("course");
        const result = document.getElementById("result");

        nameInput.addEventListener("focus", function() {
            result.textContent = "Name field is focused.";
            nameInput.style.backgroundColor = "lightyellow";
        });

        nameInput.addEventListener("blur", function() {
            result.textContent = "Name field lost focus.";
            nameInput.style.backgroundColor = "";
        });

        course.addEventListener("change", function() {
            result.textContent = "Selected course: " + (course.value || "None");
        });

        document.getElementById("myForm").addEventListener("submit", function(event) {
            event.preventDefault();

            result.textContent =
                "Form submitted! Welcome, " +
                nameInput.value.trim() + ".";
        });
    </script>
</body>
</html>
