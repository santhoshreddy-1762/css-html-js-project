
<!DOCTYPE html>
<html>
<head>
    <title>Event Delegation</title>
    <style>
        button {
            margin: 5px;
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Event Delegation</h2>
    <p>Click any button below.</p>

    <div id="buttonContainer">
        <button data-name="HTML">HTML</button>
        <button data-name="CSS">CSS</button>
        <button data-name="JavaScript">JavaScript</button>
        <button data-name="Python">Python</button>
    </div>

    <h3 id="result"></h3>

    <script>
        document.getElementById("buttonContainer").addEventListener("click", function(event) {
            if (event.target.matches("button[data-name]")) {
                document.getElementById("result").textContent =
                    "You selected " + event.target.dataset.name;
            }
        });
    </script>
</body>
</html>
