
<!DOCTYPE html>
<html>
<head>
    <title>Onclick Event</title>
</head>
<body>
    <h2>Onclick Event</h2>
    <button onclick="showMessage()">Click Me</button>
    <p id="result"></p>

    <script>
        function showMessage() {
            document.getElementById("result").textContent =
                "Button clicked successfully!";
        }
    </script>
</body>
</html>
