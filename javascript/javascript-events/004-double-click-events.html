
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Double Click Event</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        #box {
            background: #174ea6;
            color: white;
            padding: 60px 20px;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Double-Click Demonstration</h1>

    <div id="box">Double-click this box!</div>
    <h3 id="result">Waiting for double-click...</h3>

    <script>
        const box = document.getElementById("box");
        let count = 0;

        box.addEventListener("dblclick", function() {
            count++;
            box.style.backgroundColor = "green";

            document.getElementById("result").textContent =
                "Double-clicks: " + count;
        });
    </script>
</body>
</html>
