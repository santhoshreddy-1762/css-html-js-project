
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse Coordinate Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f8ff;
            padding: 30px;
        }

        #area {
            height: 350px;
            background: white;
            border: 2px solid #007bff;
            border-radius: 10px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>Mouse Coordinate Tracker</h1>
    <p>Move your mouse inside the box.</p>

    <h3 id="coordinates">X: 0 | Y: 0</h3>

    <div id="area">Move the mouse here</div>

    <script>
        const area = document.getElementById("area");
        const coordinates = document.getElementById("coordinates");

        area.addEventListener("mousemove", function(event) {
            const rect = area.getBoundingClientRect();

            const x = Math.round(event.clientX - rect.left);
            const y = Math.round(event.clientY - rect.top);

            coordinates.textContent = "X: " + x + " | Y: " + y;
        });

        area.addEventListener("mouseleave", function() {
            coordinates.textContent = "Mouse left the area";
        });
    </script>
</body>
</html>
