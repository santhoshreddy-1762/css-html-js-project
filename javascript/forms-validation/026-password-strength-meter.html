
<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Meter</title>
</head>
<body>
    <h2>Password Strength Meter</h2>

    <input type="password" id="password" placeholder="Enter password">
    <br><br>
    <progress id="meter" value="0" max="5"></progress>
    <p id="result"></p>

    <script>
        document.getElementById("password").addEventListener("input", function() {
            let password = this.value;
            let score = 0;

            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            document.getElementById("meter").value = score;

            let levels = ["Very weak", "Weak", "Fair", "Good", "Strong", "Very strong"];
            let result = document.getElementById("result");

            result.textContent = levels[score];
            result.style.color = score >= 4 ? "green" : "red";
        });
    </script>
</body>
</html>
