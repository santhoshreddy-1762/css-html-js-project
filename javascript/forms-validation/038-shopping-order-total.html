
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Order Calculator</title>
</head>
<body>
    <h2>Shopping Order</h2>

    <label>Select product:</label>
    <select id="product">
        <option value="100">Notebook - ₹100</option>
        <option value="250">Bag - ₹250</option>
        <option value="500">Headphones - ₹500</option>
    </select>

    <br><br>
    <label>Quantity:</label>
    <input type="number" id="quantity" min="1" value="1">
    <br><br>

    <button onclick="calculateTotal()">Calculate Total</button>
    <p id="result"></p>

    <script>
        function calculateTotal() {
            let price = Number(document.getElementById("product").value);
            let quantity = Number(document.getElementById("quantity").value);
            let result = document.getElementById("result");

            if (!Number.isInteger(quantity) || quantity < 1 || quantity > 100) {
                result.textContent = "Enter a quantity from 1 to 100";
                return;
            }

            let total = price * quantity;

            result.textContent =
                "Unit Price: ₹" + price +
                " | Quantity: " + quantity +
                " | Total Price: ₹" + total.toFixed(2);
        }
    </script>
</body>
</html>
