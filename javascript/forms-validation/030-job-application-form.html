
<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>
    <h2>Job Application</h2>

    <form id="form">
        <input id="name" placeholder="Full name">
        <br><br>
        <input id="email" placeholder="Email">
        <br><br>
        <select id="role">
            <option value="">Choose a role</option>
            <option>Developer</option>
            <option>Designer</option>
            <option>Analyst</option>
        </select>
        <br><br>
        <textarea id="skills" placeholder="Describe your skills (at least 20 characters)"></textarea>
        <br><br>
        <button type="submit">Submit Application</button>
    </form>

    <p id="result"></p>

    <script>
        document.getElementById("form").addEventListener("submit", function(e) {
            e.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let role = document.getElementById("role").value;
            let skills = document.getElementById("skills").value.trim();
            let result = document.getElementById("result");

            let valid = /^[A-Za-z ]{2,}$/.test(name) &&
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) &&
                role !== "" && skills.length >= 20;

            result.textContent = valid
                ? "Job application validated successfully"
                : "Please check all fields and try again";

            result.style.color = valid ? "green" : "red";
        });
    </script>
</body>
</html>
