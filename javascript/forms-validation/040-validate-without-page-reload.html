
<!DOCTYPE html>
<html>
<head>
    <title>Validation Without Reload</title>
</head>
<body>
    <h2>Form Validation Without Page Reload</h2>

    <form id="form">
        <input type="text" id="name" placeholder="Enter name">
        <br><br>
        <input type="text" id="email" placeholder="Enter email">
        <br><br>
        <button type="submit">Submit</button>
    </form>

    <p id="result"></p>

    <script>
        document.getElementById("form").addEventListener("submit", function(e) {
            e.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let result = document.getElementById("result");

            let validName = /^[A-Za-z ]{2,}$/.test(name);
            let validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

            if (validName && validEmail) {
                result.textContent = "Form validated successfully without reloading";
                result.style.color = "green";
            } else {
                result.textContent = "Please enter a valid name and email";
                result.style.color = "red";
            }
        });
    </script>
</body>
</html>
